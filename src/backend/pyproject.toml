[project]
name = "chainwise"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.3", "pyright==1.1.411"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["chainwise", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["chainwise", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
