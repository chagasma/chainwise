services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chainwise
      POSTGRES_PASSWORD: chainwise
      POSTGRES_DB: chainwise
    ports:
      - "5432:5432"
    volumes:
      - chainwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainwise"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  chainwise_postgres_data:
